project:
  name: apgra_base
  seed: 3407
  output_dir: results/apgra/base

data:
  root: auto
  manifest_dir: manifests/label_efficiency/p025_seed3407
  height: 384
  width: 256
  num_workers: 6
  batch_size: 8
  circular_roll: true
  reliability_channel: true
  depth_mix_probability: 0.30
  depth_mix_min_fraction: 0.18
  depth_mix_max_fraction: 0.40
  elastic_probability: 0.30
  elastic_alpha_azimuth: 6.0
  elastic_alpha_depth: 4.0
  elastic_sigma: 20.0
  depth_scale_probability: 0.35
  depth_scale_min: 0.78
  column_drift_probability: 0.30
  column_drift_strength: 0.08
  clahe_probability: 0.20
  blank_augment_probability: 0.25

model:
  name: apgranet
  in_channels: 3
  num_classes: 2
  widths: [24, 48, 96, 160]
  blocks: [1, 2, 2, 2]
  periodic: true
  fg_bg_interaction: true
  prototype_mode: dual
  foreground_prior: 0.05
  strip_context: true

loss:
  ce_weight: 0.6
  dice_weight: 1.0
  boundary_weight: 0.0
  cldice_weight: 0.20
  contrast_weight: 0.10
  aux_weight: 0.20
  foreground_ce_weight: 1.50
  cldice_iterations: 5
  contrast_temperature: 0.15

adaptation:
  initial_checkpoint: results/proxy_pretrain/structure_all/best.pt
  use_unlabeled: true
  azimuth_cycle_enabled: true
  ema_momentum: 0.996
  unsupervised_weight: 0.75
  ramp_epochs: 15
  confidence_threshold: 0.80
  prototype_margin: 0.05
  prototype_depth_bins: 4
  reliability_threshold: 0.50
  cycle_consistency_weight: 0.50
  georesponse_transport_weight: 0.05
  strong_noise_max: 0.035

optim:
  epochs: 120
  lr: 0.0003
  weight_decay: 0.0001
  amp: false
  warmup_epochs: 5
  early_stopping_patience: 25
  grad_clip: 1.0

eval:
  threshold_min: 0.01
  threshold_max: 0.99
  threshold_step: 0.01
  boundary_tolerance: 2
  selection_metric: soft_dice
  threshold_metric: dice
  save_predictions: true
